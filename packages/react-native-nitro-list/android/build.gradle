apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

def extOrDefault = { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }
def architectures = (rootProject.findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,x86,x86_64,arm64-v8a').split(',')

android {
  namespace 'com.nitrolist'
  compileSdkVersion extOrDefault('compileSdkVersion', 36)
  ndkVersion extOrDefault('ndkVersion', '27.1.12297006')

  defaultConfig {
    minSdkVersion extOrDefault('minSdkVersion', 24)
    targetSdkVersion extOrDefault('targetSdkVersion', 36)
    consumerProguardFiles 'consumer-rules.pro'
    externalNativeBuild {
      cmake {
        cppFlags '-frtti -fexceptions -Wall -Wextra'
        arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        abiFilters(*architectures)
      }
    }
  }

  externalNativeBuild {
    cmake { path 'CMakeLists.txt' }
  }
  buildFeatures { prefab true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  sourceSets.main.java.srcDirs += ["${buildDir}/generated/source/codegen/java"]
  packagingOptions {
    jniLibs {
      excludes += ['**/libc++_shared.so', '**/libfbjni.so', '**/libjsi.so', '**/libreactnative.so', '**/libNitroModules.so']
    }
  }
}

react {
  jsRootDir = file('../src')
  libraryName = 'NitroListSpec'
  codegenJavaPackageName = 'com.nitrolist'
}

// Match RN 0.86's Java/Kotlin toolchain, also when host alignment is disabled.
kotlin { jvmToolchain(17) }

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-nitro-modules')
  implementation project(':react-native-nitro-viewability')
  implementation 'androidx.recyclerview:recyclerview:1.4.0'
}

apply from: '../nitrogen/generated/android/NitroList+autolinking.gradle'
